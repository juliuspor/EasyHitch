<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy+Hitch · Pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --eh: #00aeef; --eh-magenta: #a8005c; --eh-deep: #0a6aa6; --navy: #002b4c; --navy-2: #003a63; --eh-pale: #bfe6f7;
    --ink: #ffffff; --muted: #9fc6de; --free: #2bd46f; --taken: #ff5a52; --sun: #ffc857;
    --glass: rgba(255,255,255,0.06); --line: rgba(255,255,255,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--navy); color: var(--ink); overflow: hidden;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, .display { font-family: "Space Grotesk", Inter, system-ui, sans-serif; letter-spacing: -0.02em; margin: 0; }

  /* 16:9 stage, scaled to the window */
  #stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: 0 0; overflow: hidden;
    background: linear-gradient(180deg, #003a63 0%, #002f53 55%, #00284a 100%); }
  .aurora { position: absolute; inset: -20%; filter: blur(150px); opacity: 0.16; pointer-events: none; }
  .aurora i { position: absolute; width: 520px; height: 520px; border-radius: 50%; mix-blend-mode: screen; animation: drift 40s ease-in-out infinite alternate; }
  .aurora i:nth-child(1) { background: #0a6aa6; left: 10%; top: 10%; }
  .aurora i:nth-child(2) { background: #00aeef; left: 60%; top: 30%; animation-duration: 27s; animation-delay: -6s; }
  .aurora i:nth-child(3) { background: #0b5c94; left: 30%; top: 60%; animation-duration: 31s; animation-delay: -12s; opacity: 0.7; }
  @keyframes drift { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(120px,-80px) scale(1.15); } 100% { transform: translate(-90px,70px) scale(0.92); } }
  .grid-bg { position: absolute; inset: 0; pointer-events: none; opacity: 0.18;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px; mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%); }

  /* slides */
  .slide { position: absolute; inset: 0 0 120px 0; padding: 70px 96px 0; opacity: 0; pointer-events: none;
    transform: translateX(90px) scale(0.985); filter: blur(8px);
    transition: opacity 0.9s cubic-bezier(.2,.8,.2,1), transform 0.9s cubic-bezier(.2,.8,.2,1), filter 0.9s cubic-bezier(.2,.8,.2,1); }
  .slide.before { transform: translateX(-90px) scale(0.985); }
  .slide.active { opacity: 1; transform: none; filter: none; pointer-events: auto; }

  /* ---------- slide 1 ---------- */
  #s1 { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-top: 0; }
  .logo-wrap { position: relative; width: 300px; height: 164px; cursor: pointer; }
  .logo-wrap img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.6s cubic-bezier(.3,1.6,.5,1); }
  .logo-wrap.wheelie img { transform: rotate(-14deg) translateY(-10px); }
  .wordmark { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 150px; line-height: 1; margin-top: 46px; letter-spacing: -0.04em; display: flex; align-items: baseline; justify-content: center; }
  .wordmark .cap { color: #fff; }
  .wordmark .plus { color: var(--eh); margin: 0 6px; }
  .wordmark .grow { display: inline-block; max-width: 0; overflow: hidden; white-space: nowrap; vertical-align: bottom; color: #fff; padding-bottom: 0.25em; margin-bottom: -0.25em;
    transition: max-width 1.1s cubic-bezier(.2,.8,.2,1); }
  #s1.play .wordmark .grow { max-width: 420px; }
  #s1.play .wordmark .grow.h { transition-delay: 0.35s; }
  .tagline { margin-top: 30px; font-size: 40px; font-weight: 500; color: var(--ink); display: flex; gap: 14px; align-items: baseline; justify-content: center; }
  .tagline .old { position: relative; color: var(--muted); }
  .tagline .old::after { content: ""; position: absolute; left: -4px; right: -4px; top: 55%; height: 4px; background: var(--taken); border-radius: 4px; transform: scaleX(0); transform-origin: left; transition: transform 0.6s 1.4s ease; }
  #s1.play .tagline .old::after { transform: scaleX(1); }
  .tagline .new { color: var(--eh); display: inline-block; max-width: 0; overflow: hidden; white-space: nowrap; transition: max-width 0.8s 2s cubic-bezier(.2,.8,.2,1); vertical-align: bottom; }
  #s1.play .tagline .new { max-width: 200px; }
  /* Opening: the logo alone in the middle, so the name stays a surprise. The first step forward brings in the name,
     the tagline and the road. 197.5 px centres the logo on the screen: half the height of the name and the tagline
     below it (137.5 px) plus half the hidden road (60 px). */
  #s1 .logo-wrap { transition: transform 0.9s cubic-bezier(.2,.8,.2,1); }
  #s1 .wordmark, #s1 .tagline { transition: opacity 0.7s 0.25s ease; }
  #stage.cover #s1 .logo-wrap { transform: translateY(197.5px); }
  #stage.cover #s1 .wordmark, #stage.cover #s1 .tagline, #stage.cover #bar { opacity: 0; }

  /* ---------- slide 2 ---------- */
  #s2 { display: grid; place-items: center; padding: 0; }
  #s2::before { content: ""; position: absolute; width: 760px; height: 760px; left: 50%; top: 50%; transform: translate(-50%,-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(0,174,239,0.14), transparent); }
  .phone { position: relative; width: 360px; height: 740px; margin: 0 auto; border-radius: 62px; padding: 14px;
    background: linear-gradient(145deg, #2b3440, #0e1218 40%, #303a46); box-shadow: 0 0 0 2px #46525f inset, 0 50px 90px rgba(0,0,0,0.55), 0 0 140px rgba(0,174,239,0.35);
    transform: scale(0.95) rotate(-4deg); transition: transform 1s cubic-bezier(.2,.8,.2,1); }
  #s2.play .phone { transform: scale(0.95); }
  .phone .btn { position: absolute; width: 4px; border-radius: 2px; background: #3a4552; }
  .phone .b1 { left: -4px; top: 150px; height: 34px; } .phone .b2 { left: -4px; top: 200px; height: 64px; } .phone .b3 { left: -4px; top: 276px; height: 64px; } .phone .b4 { right: -4px; top: 220px; height: 100px; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 48px; overflow: hidden; background: #0b1622; }
  .screen video { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---------- slide 3 ---------- */
  #s3 { display: grid; place-items: center; padding: 0 60px; }   /* as wide as the road below */
  #arch { width: 1480px; height: 400px; }   /* the 1494-wide drawing, scaled to the road */
  #arch .zone rect { fill: rgba(255,255,255,0.03); stroke: rgba(191,230,247,0.3); stroke-width: 1.5; stroke-dasharray: 6 8; }
  #arch .zone text { fill: var(--eh-pale); font-family: Inter, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; }
  #arch .node text { fill: var(--ink); font-family: Inter, sans-serif; }
  #arch .node .t { font-size: 18px; font-weight: 700; } #arch .node .d { font-size: 13px; fill: var(--muted); }
  #arch .node rect.tile { fill: #ffffff; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.25)); }
  /* The privacy filter is one stage inside the edge device, so a solid line instead of a group's dashes. */
  #arch .zone.filter rect { stroke: rgba(191,230,247,0.55); stroke-dasharray: none; }
  #arch .node .plus { font-size: 30px; font-weight: 700; fill: var(--eh-pale); text-anchor: middle; dominant-baseline: central;
    transform-box: fill-box; transform-origin: center; transition: fill 0.4s, transform 0.4s; }
  /* A box glows in the colour of the blob that reaches it: the edge device as the camera takes a frame, the privacy
     filter while it redacts it (its plus pulses too), AWS as the pixelated frame arrives, OpenRouter while Jev decides,
     and the end users as the new states reach them. */
  #arch .zone rect { transition: stroke 0.4s, filter 0.4s; }
  #arch.capturing .zone.edge rect, #arch.redacting .zone.filter rect { stroke: rgba(255,200,87,0.9); filter: drop-shadow(0 0 12px rgba(255,200,87,0.45)); }
  #arch.redacting .node .plus { fill: var(--sun); transform: scale(1.35); }
  #arch.ingesting .zone.aws rect { stroke: rgba(0,174,239,0.95); filter: drop-shadow(0 0 12px rgba(0,174,239,0.45)); }
  #arch.deciding .zone.model rect { stroke: rgba(255,255,255,0.85); filter: drop-shadow(0 0 12px rgba(255,255,255,0.35)); }
  #arch.serving .zone.users rect { stroke: rgba(43,212,111,0.9); filter: drop-shadow(0 0 12px rgba(43,212,111,0.4)); }
  #arch path.wire { fill: none; stroke: rgba(0,174,239,0.45); stroke-width: 2.5; }
  #arch .pkt { pointer-events: none; }
  #arch .zone, #arch .wires { opacity: 0; transition: opacity 0.6s; }
  #arch .node { opacity: 0; transform: translateY(14px); transition: opacity 0.6s, transform 0.6s; transform-box: fill-box; }
  #s3.play #arch .zone, #s3.play #arch .wires, #s3.play #arch .node { opacity: 1; transform: none; }

  /* ---------- bottom bar: the hamster rides between the three stops ---------- */
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; pointer-events: none; transform-origin: 0 0; transition: transform 1.6s cubic-bezier(.65,0,.25,1), opacity 0.8s ease; }
  /* Finale: bar point (1274, -30) lands at the stage centre, 2.6x larger */
  #stage.finale #bar { transform: translate(-2512px, -252px) scale(2.6); }
  /* Ending: the camera glides on to centre the hamster where it landed (bar x 1480) */
  #stage.finale.pan #bar { transform: translate(-3048px, -252px) scale(2.6); }
  #bar .road { transition: right 1.6s cubic-bezier(.65,0,.25,1); }
  #stage.finale #bar .road { right: -700px; }
  #s4::before { content: ""; position: absolute; left: 800px; top: 560px; width: 1300px; height: 1300px; transform: translate(-50%,-50%); border-radius: 50%;
    background: radial-gradient(closest-side, rgba(0,174,239,0.24), rgba(0,174,239,0.06) 55%, transparent); }
  #bar .road { position: absolute; left: 60px; right: 60px; bottom: 33px; height: 5px; background: var(--eh-magenta); border-radius: 3px; }   /* E+H magenta, the app's theme colour */
  #bar svg.stop { position: absolute; bottom: 36px; overflow: visible; transform-origin: 50% 100%; transition: opacity 0.8s ease, transform 0.8s ease, filter 0.8s ease; }
  #bar svg.stop.gone { opacity: 0; transform: translateY(8px) scale(0.92); filter: blur(4px); }
  #rider { position: absolute; bottom: 36px; width: 136px; height: 104px; pointer-events: auto; cursor: pointer; }
  #rider .flip { position: absolute; inset: 0; }
  #rider svg.hamster { position: absolute; left: 0; bottom: 0; overflow: visible; transform-origin: 50% 85%; }
  #rider .bubble { position: absolute; bottom: 112px; left: 30px; font-family: "Space Grotesk", Inter, sans-serif; font-weight: 700; font-size: 17px; line-height: 1; color: #0b1e33;
    background: #fff; padding: 9px 13px; border-radius: 14px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,0.28);
    opacity: 0; transform: translateY(8px) scale(0.85); transform-origin: 18px 100%; transition: opacity 0.18s ease, transform 0.28s cubic-bezier(.3,1.5,.5,1); pointer-events: none; }
  #rider .bubble.on { opacity: 1; transform: none; }
  #rider .bubble::after { content: ""; position: absolute; left: 14px; bottom: -5px; width: 12px; height: 12px; background: #fff; border-radius: 2px; transform: rotate(45deg); }
  .puff { animation: puff 3.3s ease-out infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
  @keyframes puff { 0% { opacity: 0; transform: translate(0, 1px) scale(0.5); } 25% { opacity: 0.6; } 100% { opacity: 0; transform: translate(1.2px, -6px) scale(1.5); } }
  .led { animation: led 2.6s steps(1) infinite; }
  @keyframes led { 0%, 72% { opacity: 1; } 73%, 100% { opacity: 0.25; } }
  #fx { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; pointer-events: none; z-index: 35; }
  .stand-lbl { position: absolute; bottom: 8px; font-size: 13px; color: var(--muted); letter-spacing: 0.08em; transform: translateX(-50%); transition: opacity 0.8s ease, filter 0.8s ease; }
  .stand-lbl.gone { opacity: 0; filter: blur(3px); }
  /* Ending lockup: the logo falls in, then the wordmark letter by letter, then the tagline */
  #endmark { position: absolute; left: 0; right: 0; top: 44px; text-align: center; pointer-events: none; z-index: 20; visibility: hidden; }
  #endmark.on { visibility: visible; }
  #endmark .mark { width: 190px; height: 104px; display: block; margin: 0 auto; opacity: 0; }
  #endmark .word { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 104px; line-height: 1; letter-spacing: -0.04em; margin-top: 18px; }
  #endmark .word span { display: inline-block; opacity: 0; }
  #endmark .word .cap { color: #fff; } #endmark .word .plus { color: var(--eh); margin: 0 4px; }
  #endmark .word .soft { color: #fff; }
  #endmark .tag { margin-top: 14px; font-size: 27px; font-weight: 500; color: var(--ink); opacity: 0; }
  #endmark .tag b { color: var(--eh); font-weight: 600; }
  #endmark.on .mark { animation: fall 1.05s forwards; }
  #endmark.on .word span { animation: fall 0.95s forwards; animation-delay: calc(0.45s + var(--i) * 0.065s); }
  #endmark.on .tag { animation: rise 0.9s cubic-bezier(.2,.8,.2,1) 1.65s forwards; }
  @keyframes fall {
    0% { opacity: 0; transform: translateY(-420px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
    12% { opacity: 1; }
    62% { transform: translateY(0); animation-timing-function: cubic-bezier(0,.55,.45,1); }
    76% { transform: translateY(-14px); animation-timing-function: cubic-bezier(.55,0,1,.45); }
    88% { transform: translateY(0); animation-timing-function: cubic-bezier(0,.55,.45,1); }
    94% { transform: translateY(-3px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  #timer { position: absolute; left: 30px; top: 22px; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; display: none; } #timer.on { display: block; }
  #timer.warn { color: var(--sun); } #timer.over { color: var(--taken); }
  #toast { position: absolute; left: 50%; top: 40px; transform: translate(-50%, -30px); opacity: 0; padding: 16px 24px; border-radius: 16px; background: rgba(0,43,76,0.92); border: 1px solid var(--eh); font-size: 22px; transition: all 0.5s cubic-bezier(.2,1.4,.4,1); z-index: 50; text-align: center; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #notes { position: absolute; left: 96px; right: 96px; bottom: 128px; padding: 16px 20px; border-radius: 14px; background: rgba(0,0,0,0.75); font-size: 19px; line-height: 1.45; display: none; z-index: 40; }
  #notes.on { display: block; }
  .parade { position: absolute; pointer-events: none; z-index: 30; overflow: visible; }
</style>
</head>
<body>
<div id="stage" class="cover">
  <div class="aurora"><i></i><i></i><i></i></div>
  <div class="grid-bg"></div>
  <div id="timer">0:00 / 3:00</div>

  <!-- 1 · Title -->
  <section class="slide" id="s1">
    <!-- eh-mark.svg is the symbol from eh-logo-official.svg, the current logo served on endress.com (checked 31 Oct 2026) -->
    <div class="logo-wrap" id="logo"><img src="eh-mark.svg" alt="Endress+Hauser logo"></div>
    <div class="wordmark"><span class="cap">E</span><span class="grow">asy</span><span class="plus">+</span><span class="cap">H</span><span class="grow h">itch</span></div>
    <div class="tagline"><span class="old">People</span><span class="new">Bikers</span><span>for Process Automation</span></div>
  </section>

  <!-- 2 · Demo on the phone: a recording of the app's demo mode, the fallback for the live demo -->
  <section class="slide" id="s2">
    <div class="phone">
      <i class="btn b1"></i><i class="btn b2"></i><i class="btn b3"></i><i class="btn b4"></i>
      <div class="screen">
        <video id="demo" src="demo.mp4" muted loop playsinline preload="auto"></video>
      </div>
    </div>
  </section>

  <!-- 3 · Architecture in four groups: the edge (a camera board on an edge device), AWS, the model, end users -->
  <section class="slide" id="s3">
    <svg id="arch" viewBox="0 0 1494 404">

<script src="vendor/confetti.browser.js"></script>
<script>
// ---------------------------------------------------------------- stage scaling and navigation
const stage = document.getElementById('stage');
function fit() { const s = Math.min(innerWidth / 1600, innerHeight / 900); stage.style.transform = `translate(-50%,-50%) scale(${s})`; stage.style.transformOrigin = 'center'; }
addEventListener('resize', fit); fit();
const slides = [...document.querySelectorAll('.slide')];
const NOTES = [
  '~40 s · Innovation + impact. Open on the logo alone. 7:45 at E+H: both stands look full, you circle, you are late. Click to reveal the name: Easy+Hitch tells you which exact spot is free before you turn the corner. Spot-level, not just “full”, from low-cost cameras like the challenge’s ESP32 boards. Less searching, more people choosing the bike, and real occupancy data for facility planning.',
  '~80 s · Live demo on the phone, on Demo data: the blue dot on Christoph-Merian-Ring, the map with free spots per stand, the south stand, then 3D Navigation down the street, turning left to the free spot. If the live demo fails, this slide’s phone plays a recording of the same flow.',
  '~45 s · Technical depth + fair play. Edge: the XIAO ESP32S3 camera board feeds a secure edge device on site over USB, a Mac in our tests. There YOLO11n redacts faces and PP-OCRv5 redacts licence plates, and a frame leaves the site only when the view changed. AWS: two Lambda functions, each behind its own function URL, no API Gateway. The Ingest API compares each slot with its last fingerprint in DynamoDB and asks Jev 1.14, TypeSafe’s decision model, through OpenRouter, one yes-or-no question per changed slot, with no training data. DynamoDB keeps slot states and fingerprints, never images, and the keys sit in SSM Parameter Store. The Availability API serves the iOS app over REST and AI agents over MCP. In the demo, a simulator fills the stations without a camera. Nobody is tracked.',
  '~10 s · Close while the hamster lands: “You ride, we find the spot. Easy+Hitch.” Thank the jury.',
];
let cur = 0, started = null;
function show(i, dir = 1) {
  i = Math.max(0, Math.min(slides.length - 1, i));
  if (i === cur && slides[i].classList.contains('active')) return;
  const from = cur; cur = i;
  slides.forEach((s, k) => { s.classList.toggle('active', k === i); s.classList.toggle('before', k < i); s.classList.remove('play'); });
  void slides[i].offsetWidth; setTimeout(() => slides[i].classList.add('play'), 120);
  document.getElementById('notes').textContent = NOTES[i];
  if (i === 3) finale(); else { resetEnding(); ride(from, i); }
  if (i === 1) phone.start(); else phone.stop();
  if (i === 2) packets.start(); else packets.stop();
  if (started === null && i > 0) started = performance.now();
}
addEventListener('keydown', (e) => {
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); forward(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); show(cur - 1); }

    if (!riding && !busy && performance.now() >= quietUntil) { hamster.pose({ blink: true }); setTimeout(() => !riding && !busy && hamster.pose(), 170); }
    blink();
  }, 4000 + Math.random() * 3000);
})();
rider.addEventListener('click', () => trick());

function ride(from, to) {
  // Into DEMO: hop a bump, find the stand FULL, check the app, a spot frees up, park.
  // Into TECH STACK: park, pause, then the three lines 8 s apart. Backwards: just ride.
  story.forEach(clearTimeout); story = []; ham.getAnimations().forEach(a => a.cancel()); busy = true;
  const my = ++epoch;
  const forward = to > from, full = forward && to === 1, target = spot(to) - (full ? WAIT : 0), start = hx, t0 = performance.now(), dur = 1500;
  flip.style.transform = `scaleX(${target >= start ? 1 : -1})`;
  cancelAnimationFrame(riding);
  const step = (now) => {
    const t = Math.min(1, (now - t0) / dur), e = t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
    hx = start + (target - start) * e; placeRider();
    const h = forward ? Math.sin(Math.PI * Math.min(1, Math.max(0, (t - 0.42) / 0.2))) * 30 : 0;   // bunny hop over a bump
    ham.style.transform = `translateY(${-h}px)`;
    hamster.roll(hx);
    if (t < 1) { riding = requestAnimationFrame(step); return; }
    riding = null; ham.style.transform = '';
    if (full) {
      say('FULL?!', 1300); move([0, -8, 8, -6, 0].map(d => ({ transform: `rotate(${d}deg)` })), 450);
      later(1600, () => say('*checking app*', 1400));
      later(3300, () => rollIn(to, my));   // a spot freed up; no line here, so nothing has to match the live demo
      return;
    }
    if (!(forward && to === 2)) { settle(); return; }
    PRIVACY.forEach((line, k) => later(2000 + k * 8000, () => say(line, 2200)));
    later(20500, settle);
  };
  riding = requestAnimationFrame(step);
}
function rollIn(to, my) {
  // Roll up beside the freed spot and park. The celebration is saved for the finale.
  const start = hx, target = spot(to), t0 = performance.now();
  const step = (now) => {
    if (my !== epoch) return;
    const t = Math.min(1, (now - t0) / 600); hx = start + (target - start) * t; placeRider(); hamster.roll(hx);
    if (t < 1) return requestAnimationFrame(step);
    settle();
  };
  requestAnimationFrame(step);
}
function fireworks() {
  // A short celebration: one cannon from each bottom corner, then three small pops.
  if (!fx) return;
  const colors = ['#00aeef', '#ffffff', '#2bd46f', '#bfe6f7', '#ffd166'];
  for (const [x, angle] of [[0, 60], [1, 120]]) fxFire({ particleCount: 40, angle, spread: 50, startVelocity: 55, gravity: 1, ticks: 200, scalar: 1.1, colors, origin: { x, y: 1 } });
  [0.3, 0.7, 0.5].forEach((x, k) => story.push(setTimeout(() => {
    if (cur === 3) fxFire({ particleCount: 28, spread: 360, startVelocity: 20, gravity: 0.8, ticks: 90, scalar: 1, colors, origin: { x, y: 0.2 + 0.07 * k } });
  }, 300 + k * 380)));
}
const endmark = document.getElementById('endmark');
function resetEnding() {
  stage.classList.remove('finale', 'pan'); endmark.classList.remove('on'); fx?.reset(); bubble.style.translate = '';
  stands[2].classList.remove('gone'); labels[2].classList.remove('gone');
}
function finale() {
  // Zoom in on the tech stand, say the name, then a stunt off the stand's roof.
  story.forEach(clearTimeout); story = []; ham.getAnimations().forEach(a => a.cancel()); cancelAnimationFrame(riding); riding = null;
  resetEnding();
  const my = ++epoch; busy = true;
  hx = spot(2); placeRider(); flip.style.transform = 'scaleX(1)'; ham.style.transform = ''; hamster.pose();
  stage.classList.add('finale');
  later(1800, () => { say('Easy+Hitch!', 1300); bell(); });
  later(2400, () => stunt(my));   // crouch at 0.6 s, hop at 0.85 s after the name
}
function stunt(my) {
  // Stage-free timeline in bar pixels: x is the rider's centre, y the lift above the road.
  const t0 = performance.now(), roof = 70, ease = (u) => u < 0.5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2;
  const seg = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
  let landed = false;
  ham.style.transformOrigin = '50% 60%';
  const step = (now) => {
    if (my !== epoch) return;
    const t = now - t0; let x, y = 0, rot = 0, sy = 1;
    // The front wheel parks 12 px short of the stand, so he crouches in place and bunny-hops: the hop
    // reaches roof height before he has moved 10 px forward, then carries him onto the roof.
    if (t < 250) { const u = seg(t, 0, 250); x = spot(2); sy = 1 - 0.1 * ease(u); }   // crouch
    else if (t < 800) { const u = seg(t, 250, 800); x = spot(2) + 110 * u * u; y = 303 * u - 233 * u * u; rot = -12 * Math.sin(Math.PI * u); sy = 1 - 0.1 * (1 - Math.min(1, u / 0.25)) ** 2; }   // hop onto the roof
    else if (t < 1050) { const u = seg(t, 800, 1050); x = spot(2) + 110 + 30 * u; y = roof; sy = 1 - 0.08 * Math.sin(Math.PI * u); }   // touch down on the roof
    else if (t < 2050) { const u = seg(t, 1050, 2050); x = spot(2) + 140 + 150 * u; y = roof * (1 - u) + 380 * u * (1 - u); rot = -360 * ease(Math.min(1, u / 0.88)); }   // one backflip, level before touchdown
    else { const u = seg(t, 2050, 2450); x = spot(2) + 290; sy = 1 - 0.14 * Math.sin(Math.PI * u); }   // land
    hx = x; placeRider();
    // Squashing about the 60% origin would lift the wheels; shift down by the same amount to keep them planted.
    ham.style.transform = `translateY(${-y + 37.8 * (1 - sy)}px) rotate(${rot}deg) scaleY(${sy})`;
    bubble.style.translate = `0 ${-y}px`;   // "Easy+Hitch!" rides up with him instead of being hopped into
    hamster.roll(hx);
    if (t >= 2050 && !landed) { landed = true; fireworks(); bell(); }
    if (t < 2450) return requestAnimationFrame(step);
    ham.style.transform = ''; bubble.style.translate = '';
    ending();
  };
  requestAnimationFrame(step);
}
function ending() {
  // The tech stand dissolves, the camera glides to the hamster, the logo falls in, then a victory wheelie and a "Yay <3".
  later(250, () => { stands[2].classList.add('gone'); labels[2].classList.add('gone'); });
  later(650, () => stage.classList.add('pan'));
  later(1500, () => { endmark.classList.remove('on'); void endmark.offsetWidth; endmark.classList.add('on'); });
  later(3300, () => {
    ham.style.transformOrigin = '24% 96%';
    ham.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-20deg)' }], { duration: 600, easing: 'cubic-bezier(.3,1.4,.5,1)', fill: 'forwards' });
    say('Yay <3', 2600);
  });
}
function arrive() {
  // Opening: the hamster rolls out of the front door, ready to ride to work.
  const from = STAND_X[0] - 30, target = spot(0), t0 = performance.now(), my = ++epoch; busy = true;
  hx = from; placeRider(); rider.style.opacity = 0;
  const step = (now) => {
    if (my !== epoch) return;
    const t = Math.min(1, (now - t0) / 1500), e = 1 - (1 - t) ** 3; hx = from + (target - from) * e; placeRider();
    rider.style.opacity = Math.min(1, t * 4); hamster.roll(hx);
    if (t < 1) return requestAnimationFrame(step);
    settle();
  };
  setTimeout(() => requestAnimationFrame(step), 500);
}

// ---------------------------------------------------------------- slide 2: the app's demo mode, recorded
// demo.mp4 is the iOS app in demo mode, recorded in the iPhone 17 Pro simulator: the rider's blue dot
// on the map, the south station, then 3D Navigation down Christoph-Merian-Ring to its free spot.
const phone = (() => {
  const video = document.getElementById('demo');
  return {
    start() { video.currentTime = 0; video.play().catch(() => {}); },   // autoplay may be refused before a key press
    stop() { video.pause(); },
  };
})();

// ---------------------------------------------------------------- slide 3: one frame at a time through the pipeline
const packets = (() => {
  const svg = document.getElementById('packets'), NS = 'http://www.w3.org/2000/svg';
  // A calm relay of glowing blobs instead of a constant stream, and each box glows as a blob reaches it. The camera
  // board's raw frame (yellow) goes over USB into the privacy filter, and only the pixelated frame (blue) leaves it for
  // Ingest. Ingest reads the last slot states and fingerprints (green) from DynamoDB, sends the changed slots to Jev
  // (white), and gets its answer back (white). Ingest writes the new states (green), which are served to the app and
  // the agents. At most two blobs move at once.
  // [wire, colour, start s, duration s, backwards, blob radius]. GLOWS: [class on the drawing, from s, to s].
  const CYCLE = 9.2, GLOWS = [['capturing', 0, 0.6], ['redacting', 0.75, 1.45], ['ingesting', 2.0, 2.7],
    ['deciding', 3.65, 4.35], ['serving', 7.6, 8.3]], hops = [
    ['wC', '#ffc857', 0, 0.8, false, 9], ['wE', '#00aeef', 1.3, 0.8, false, 8], ['w2', '#2bd46f', 2.3, 0.6, true, 7],
    ['wJ', '#ffffff', 3.1, 0.6, false, 8], ['wJ', '#ffffff', 4.2, 0.6, true, 7], ['w2', '#2bd46f', 5.0, 0.6, false, 7], ['w3', '#2bd46f', 5.9, 0.6, false, 7],
    // The agents' branch leaves the app's wire at the junction, which the blob passes about 0.4 s in.
    ['wU', '#2bd46f', 6.8, 0.9, false, 8], ['wD', '#2bd46f', 7.2, 0.5, false, 8],
  ];
  const arch = document.getElementById('arch'), ease = (u) => u < 0.5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2;
  let raf = null, t0 = 0, dots = [];
  function frame(now) {
    const t = (now - t0) / 1000, c = t - CYCLE * Math.floor(t / CYCLE);
    dots.forEach(({ dot, path, len, start, dur, back, blob }) => {
      const u = t < 0 ? -1 : (c - start) / dur;
      if (u < 0 || u > 1) return dot.setAttribute('opacity', 0);
      const pt = path.getPointAtLength(len * (back ? 1 - ease(u) : ease(u)));
      dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y);
      dot.setAttribute('opacity', Math.min(1, u / 0.15, (1 - u) / 0.15));   // fade in and out at the ends
      if (blob) dot.setAttribute('r', blob * (0.7 + 0.3 * Math.sin(Math.PI * u)));   // swells on the way
    });
    GLOWS.forEach(([name, from, to]) => arch.classList.toggle(name, t >= 0 && c >= from && c < to));
    raf = requestAnimationFrame(frame);
  }
  function start() {
    if (raf || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    svg.innerHTML = '';
    dots = hops.map(([id, color, start, dur, back, blob]) => {
      const path = document.getElementById(id), dot = document.createElementNS(NS, 'circle');
      dot.setAttribute('r', blob ?? 5); dot.setAttribute('fill', color); dot.setAttribute('class', 'pkt'); dot.setAttribute('opacity', 0);
      if (blob) dot.setAttribute('filter', 'url(#glow)');
      svg.appendChild(dot);
      return { dot, path, len: path.getTotalLength(), start, dur, back, blob };
    });
    t0 = performance.now() + 1000;   // the first frame leaves once the boxes have faded in
    raf = requestAnimationFrame(frame);
  }
  return { start, stop() { cancelAnimationFrame(raf); raf = null; svg.innerHTML = ''; GLOWS.forEach(([name]) => arch.classList.remove(name)); } };
})();

// ---------------------------------------------------------------- easter eggs
let audio;
function bell() {
  try {
    audio ??= new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.22].forEach((d) => [2093, 3136].forEach((f) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + d;
      o.frequency.value = f; o.type = 'sine'; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.55);
    }));
  } catch (e) { /* no audio, no problem */ }
}
function toast(html, ms = 3200) { const t = document.getElementById('toast'); t.innerHTML = html; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms); }
// Click the logo: it pops a wheelie and rings the bell.
let logoClicks = 0;
document.getElementById('logo').addEventListener('click', () => {
  const l = document.getElementById('logo'); l.classList.add('wheelie'); bell(); setTimeout(() => l.classList.remove('wheelie'), 650);
  if (++logoClicks === 3) toast('🔔 Ring ring! Easy+Hitch now ships with a <b>bell</b>.');
});
// Konami code: the great hamster bike parade.
const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
let kpos = 0, typed = '';
function eggs(key) {
  kpos = key === KONAMI[kpos] ? kpos + 1 : (key === KONAMI[0] ? 1 : 0);
  if (kpos === KONAMI.length) { kpos = 0; parade(); }
  typed = (typed + key).slice(-6);
  if (typed.endsWith('42')) toast('🌌 Don’t panic. Easy+Hitch found <b>42</b> free spots.<br><small>Always bring a towel. And a bike lock.</small>', 4200);
}
function parade() {
  toast('🐹🚲 The Great Hamster Bike Parade!'); bell();
  for (let i = 0; i < 26; i++) {
    const h = makeHamster(), size = 0.5 + (i % 3) * 0.25, c = h.svg;
    c.classList.add('parade'); c.setAttribute('width', 136 * size); c.setAttribute('height', 104 * size);
    c.style.filter = `hue-rotate(${(i * 47) % 360}deg)`; c.style.left = '-160px'; c.style.bottom = (8 + (i * 37) % 700) + 'px'; stage.appendChild(c);
    const speed = 380 + (i * 71) % 420, t0 = performance.now() + i * 120;
    const step = (now) => { const x = -160 + Math.max(0, now - t0) / 1000 * speed; c.style.left = x + 'px'; h.roll(x / size);
      if (x < 1700) requestAnimationFrame(step); else c.remove(); };
    requestAnimationFrame(step);
  }
}

// The deck opens on the logo alone (the stage starts with class cover, so nothing slides on load), and the name stays
// a surprise until the first step forward reveals it.
slides[0].classList.add('active'); show(0);
document.getElementById('notes').textContent = NOTES[0];
function forward() { if (stage.classList.contains('cover')) reveal(); else show(cur + 1); }
function reveal() {
  stage.classList.remove('cover'); arrive();
  setTimeout(() => slides[0].classList.add('play'), 700);   // E+H grows into Easy+Hitch once it has faded in
  started = started ?? performance.now();
}
